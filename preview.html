<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>古手梨花 · 桌面宠物预览</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#f0edff;background:#101221}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 15%,#303360,transparent 65%),#101221}main{width:min(760px,100%)}.eyebrow{color:#b6b7f0;font-size:12px;letter-spacing:.22em}h1{font-size:36px;margin:10px 0}p{color:#bac0d9;line-height:1.8}.stage{height:440px;display:grid;place-items:center;position:relative;border:1px solid #4b527c;border-radius:24px;background:radial-gradient(ellipse at center,#424c76,#252b46 68%);overflow:hidden;touch-action:none}.stage.light{background:radial-gradient(ellipse at center,#fafaff,#dfe4f4 72%)}.sprite{width:192px;height:208px;background-image:url('spritesheet.webp');background-size:1536px 2288px;background-repeat:no-repeat;transform:scale(1.65);image-rendering:auto}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}button,select{font:inherit;font-size:14px;border:1px solid #5b6289;border-radius:12px;padding:11px 15px;color:#f1efff;background:#252b47;cursor:pointer}button:hover,select:hover{background:#3c426a}button[aria-pressed=true]{background:#5b568f;border-color:#aca5e6}select{min-width:150px}.note{font-size:13px}.badge{position:absolute;left:18px;bottom:15px;color:#b7bfdf;font-size:12px}.light .badge{color:#4d577c}a{color:#c7b7ff}.error{display:none;color:#ffbbbf}.error.show{display:block}@media(max-width:480px){body{padding:18px}h1{font-size:29px}.stage{height:380px}.sprite{transform:scale(1.4)}}
</style>
<style>.sprite{cursor:grab;border-radius:16px;outline-offset:4px}.sprite:focus-visible{outline:2px solid #c7b7ff}.stage .badge{pointer-events:none}</style>
<main>
 <div class="eyebrow">HINAMIZAWA COMPANION</div>
 <h1>古手梨花 · 桌面伙伴</h1>
 <p>深蓝长发、白衣绯袴，还有一抹温柔的微笑。<br><span class="note">摸摸头，她会闭眼笑；安静时也有呼吸、眨眼和发梢轻摆。</span></p>
 <div class="stage" id="stage" aria-label="宠物动作预览区域"><div class="sprite" id="sprite" role="button" tabindex="0" aria-label="摸摸古手梨花的头"></div><span class="badge" id="badge">悠闲待机 · 呼吸摇头</span></div>
 <div class="controls">
  <select id="state" aria-label="选择动作"><option value="idle">悠闲待机 · 呼吸摇头</option><option value="idle-calm">安静待机 · 眨眼</option><option value="running-right">向右移动</option><option value="running-left">向左移动</option><option value="waving">挥手打招呼</option><option value="jumping">摸摸头 · 开心回应</option><option value="jumping-original">轻轻跳跃</option><option value="failed">有点沮丧</option><option value="waiting">等待你的回应</option><option value="running">认真思考</option><option value="review">仔细查看</option></select>
  <button id="pet">摸摸头</button>
  <button id="pause" aria-pressed="false">暂停动画</button>
  <button id="follow" aria-pressed="false">跟随鼠标</button>
  <button id="backdrop">切换浅色背景</button>
 </div>
 <p class="note">把鼠标移到梨花头上，或点击“摸摸头”，她会给你一个回应。打开“跟随鼠标”可体验目光变化。<br>桌面皮肤已更新待机和悬停回应；预览额外保留原来的安静眨眼与跳跃，可切换 11 组动画。</p>
 <p class="error" id="error">未找到皮肤文件。请保持此页面与 spritesheet.webp、original-actions.webp 在同一目录。</p>
 <p class="note"><a href="rika-main.png">查看角色主图</a> · <a href="rika-pet.zip">保存皮肤包</a></p>
</main>
<script>
const states={idle:[0,[1680,660,660,840,840,1920]],'idle-calm':[0,[1680,660,660,840,840,1920],true],'running-right':[1,[120,120,120,120,120,120,120,220]],'running-left':[2,[120,120,120,120,120,120,120,220]],waving:[3,[140,140,140,280]],jumping:[4,[140,140,140,140,280]],'jumping-original':[4,[140,140,140,140,280],true],failed:[5,[140,140,140,140,140,140,140,240]],waiting:[6,[150,150,150,150,150,260]],running:[7,[120,120,120,120,120,220]],review:[8,[150,150,150,150,150,280]]};
const el=id=>document.getElementById(id),sprite=el('sprite'),stage=el('stage');
const sources={current:'spritesheet.webp',original:'original-actions.webp'};
let frame=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,follow=false,look=null,interaction=null,patLoops=0,patCount=0,insideHead=false,lastPat=-Infinity,assetKey=null;
function draw(row,col,original=false){const key=original?'original':'current';if(assetKey!==key){sprite.style.backgroundImage=`url('${sources[key]}')`;assetKey=key}sprite.style.backgroundPosition=`${-192*col}px ${-208*row}px`}
function pauseLabel(){el('pause').textContent=paused?'播放动画':'暂停动画';el('pause').setAttribute('aria-pressed',String(paused))}pauseLabel();
function stateLabel(){el('badge').textContent=el('state').selectedOptions[0].textContent}
function beginPat(){const now=performance.now();if(now-lastPat<1200)return;lastPat=now;patCount++;interaction='jumping';patLoops=0;frame=paused?2:0;last=0;look=null;el('badge').textContent=`摸摸头 · 咪啪～ ${patCount}`;draw(4,frame)}
function hitHead(e){const r=sprite.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;return x>.2&&x<.8&&y>.02&&y<.45}
el('state').onchange=()=>{frame=0;last=0;look=null;interaction=null;stateLabel();const [row,,original]=states[el('state').value];draw(row,0,original)};
el('pet').onclick=beginPat;
sprite.onpointerdown=e=>{if(e.button===0&&hitHead(e)){e.preventDefault();beginPat()}};
sprite.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();beginPat()}};
el('pause').onclick=()=>{paused=!paused;last=0;pauseLabel()};
el('follow').onclick=()=>{follow=!follow;look=null;el('follow').setAttribute('aria-pressed',String(follow));el('follow').textContent=follow?'已开启目光跟随':'跟随鼠标'};
el('backdrop').onclick=()=>{const light=stage.classList.toggle('light');el('backdrop').textContent=light?'切换深色背景':'切换浅色背景'};
stage.onpointermove=e=>{const hit=hitHead(e);if(hit&&!insideHead)beginPat();insideHead=hit;if(!follow)return;const r=sprite.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height*.3);look=Math.hypot(dx,dy)<28?null:Math.round((Math.atan2(dx,-dy)+Math.PI*2)%(Math.PI*2)/(Math.PI/8))%16};
stage.onpointerleave=()=>{look=null;insideHead=false};
function tick(t){const selected=interaction||el('state').value;const [row,durations,original]=states[selected];if(look!==null&&follow&&!interaction){draw(9+Math.floor(look/8),look%8);last=t}else{if(!last)last=t;if(!paused&&t-last>=durations[frame]){frame++;last=t;if(frame>=durations.length){frame=0;if(interaction&&++patLoops>=2){interaction=null;stateLabel()}}}if(selected!==(interaction||el('state').value)){const [nextRow,,nextOriginal]=states[el('state').value];draw(nextRow,0,nextOriginal)}else draw(row,frame,original)}requestAnimationFrame(tick)}
for(const src of Object.values(sources)){const asset=new Image();asset.onerror=()=>el('error').classList.add('show');asset.src=src}requestAnimationFrame(tick);
</script>
</html>
